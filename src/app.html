<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/RYL.png" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/RYL.png" />

    <!--
      Two faces are needed before first paint: the serif for the wordmark and the
      mono for the chrome. Only the `latin` subsets are preloaded — latin-ext
      exists for the odd diacritic and can arrive late.
    -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/Newsreader-Regular-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/GeistMono-Regular-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Marks the document as scripted before any CSS is evaluated, which is what
      lets stylesheets branch on `html.js` without a flash: the scroll-reveal
      rules must not hide anything on a page that will never run the observer,
      and the `[M]` buttons must not appear on one that cannot handle a click.
    -->
    <script>
      document.documentElement.classList.add('js');
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
